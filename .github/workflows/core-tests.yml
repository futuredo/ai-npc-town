name: 核心逻辑测试

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出工程
        uses: actions/checkout@v7.0.1
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: 运行核心逻辑测试
        run: dotnet test dotnet/Town.sln --configuration Release --verbosity minimal
